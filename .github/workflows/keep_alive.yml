name: Keep Streamlit Alive

on:
  schedule:
    # 매 4시간마다 실행 (UTC 기준)
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sL --max-time 30 "https://my-robo-chatbot-gny8ckkm4hmedodw4gvwfe.streamlit.app/" > /dev/null || true
          echo "Streamlit App Pinged Successfully! (No commits created)"
